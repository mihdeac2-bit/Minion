name: Build Minion Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q minion-client-stage1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
        working-directory: minion-client
      - uses: actions/upload-artifact@v4
        with:
          name: minion-client-jar
          path: minion-client/build/libs/*.jar
